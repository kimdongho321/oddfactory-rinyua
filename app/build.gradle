plugins { id 'com.android.application' }
android {
 namespace 'com.oddfactory.renewatheater'
 compileSdk 35
 defaultConfig { applicationId 'com.oddfactory.renewatheater'; minSdk 30; targetSdk 35; versionCode 24; versionName '0.16.8' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets.main.assets.setSrcDirs([file('src/main/assets')])
 buildTypes { release { debuggable false; crunchPngs false; minifyEnabled false; shrinkResources false; } }
 lint { abortOnError true;checkReleaseBuilds true }
 
 androidResources { noCompress 'png' }
}
tasks.withType(JavaCompile).configureEach { options.debug = false }

